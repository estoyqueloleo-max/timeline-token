name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # Descarga los archivos reales de LFS

      - name: Prepare Public Dir
        run: |
          mkdir -p public
          if [ -f news_central.db.gz ]; then
            cp news_central.db.gz public/
          elif [ -f news_central.db ]; then
            gzip -9 -c news_central.db > public/news_central.db.gz
          fi
          cp semantic_map.html public/index.html
          cp semantic_map.html public/
          cp README.md public/
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # Esto evita que se intente usar LFS en la rama de despliegue
          disable_nojekyll: false 
