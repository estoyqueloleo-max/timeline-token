name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # Descarga los archivos reales de LFS

      - name: Prepare Public Dir
        run: |
          mkdir -p public
          # Copiamos la DB y el visor (renombrado a index.html para que sea la home)
          cp news_central.db public/
          cp semantic_map.html public/index.html
          cp semantic_map.html public/
          # Opcional: copiar el README si quieres tenerlo ahí
          cp README.md public/
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # Esto evita que se intente usar LFS en la rama de despliegue
          disable_nojekyll: false 
