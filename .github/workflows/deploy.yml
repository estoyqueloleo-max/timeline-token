name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_files: news_central.db,semantic_map.html,README.md
          # Note: We keep the whole root if we want, but it's cleaner to only publish what's needed.
          # However, peaceiris/actions-gh-pages usually takes a directory.
          # I'll create a 'public' dir and copy files there.

      - name: Prepare Public Dir
        run: |
          mkdir -p public
          cp news_central.db public/
          cp semantic_map.html public/index.html
          cp semantic_map.html public/
          
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
